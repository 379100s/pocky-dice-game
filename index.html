
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>포키 주사위 게임 ♡</title>
    <meta property="og:title" content="">
    <meta property="og:description" content="">
    <meta property="og:image" content="">
    <meta name="robots" content="noindex,nofollow">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Apple SD Gothic Neo', sans-serif;
      background-color: #fffafc;
      margin: 0;
      padding: 0;
      position: relative;
      overflow: hidden;
    }

    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
      visibility: hidden;
      z-index: 0;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .active {
      visibility: visible;
      z-index: 1;
      opacity: 1;
    }

    h1 {
      font-size: 1.8rem;
      color: #d63d68;
      margin-bottom: 30px;
    }

    button {
      padding: 12px 24px;
      font-size: 1.1rem;
      background-color: #000;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background-color: #333;
    }

    #typingText, #endingText {
      font-size: 1.2rem;
      color: #333;
      white-space: pre-wrap;
      min-height: 80px;
      line-height: 2.2;
    }

    #pockyImage {
      margin-top: 30px;
      width: 60%;
      max-width: 300px;
      display: none;
    }

    #nagumoCheer {
      font-size: 1.2rem;
      color: #333;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="screen active" id="screen1">
    <h1>어떤 맛으로 가볼래? ♡</h1>
    <button onclick="rollDice()">주사위 굴리기 ♡</button>
  </div>

  <div class="screen" id="screen2">
    <h1 id="typingText"></h1>
    <button onclick="goToScreen(3)">먹으러 가기 🍫</button>
  </div>

  <div class="screen" id="screen3">
    <h1 id="endingText"></h1>
    <img id="pockyImage" src="nagumo-invisible.jpeg" alt="나구모 투명화 이미지" />
    <div id="nagumoCheer">화이팅, 나구모!</div>
  </div>

  <script>
    const screens = document.querySelectorAll(".screen");
    const flavors = ["초콜릿", "말차", "딸기", "쿠키앤크림", "블루베리", "바나나"];

    function goToScreen(n) {
      screens.forEach((screen, index) => {
        screen.classList.remove("active");
        if (index === n - 1) {
          screen.classList.add("active");
        }
      });
      if (n === 3) showEnding();
    }

    function rollDice() {
      const selected = flavors[Math.floor(Math.random() * flavors.length)];
      goToScreen(2);
      typeText(`축 당첨! 당신의 포키는 ${selected} 맛!`);
    }

    function typeText(text) {
      const el = document.getElementById("typingText");
      el.innerText = "";
      let i = 0;
      const interval = setInterval(() => {
        el.innerText += text.charAt(i);
        i++;
        if (i >= text.length) clearInterval(interval);
      }, 70);
    }

    function showEnding() {
      const el = document.getElementById("endingText");
      const lines = [
        "당신은 포키를 들었다.",
        "그러나 포키는 투명화되어 사라졌다."
      ];
      let lineIndex = 0;
      let charIndex = 0;
      el.innerText = "";

      const interval = setInterval(() => {
        const currentLine = lines[lineIndex].substring(0, charIndex + 1);
        const previous = lines.slice(0, lineIndex).join("\n\n");
        el.innerText = previous + (lineIndex > 0 ? "\n\n" : "") + currentLine;
        charIndex++;

        if (charIndex === lines[lineIndex].length) {
          lineIndex++;
          charIndex = 0;
          if (lineIndex === lines.length) {
            clearInterval(interval);
            setTimeout(() => {
              document.getElementById("pockyImage").style.display = "block";
              document.getElementById("nagumoCheer").style.display = "block";
            }, 300);
          }
        }
      }, 70);
    }
  </script>

</body>
</html>
