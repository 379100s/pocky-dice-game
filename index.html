
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>포키 주사위 게임 ♡</title>
  <style>
    body {
      font-family: 'Apple SD Gothic Neo', sans-serif;
      background-color: #fffafc;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .slide {
      position: absolute;
      top: 0;
      left: 100vw;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: left 0.6s ease-in-out;
      padding: 20px;
    }

    .active {
      left: 0 !important;
    }

    h1 {
      font-size: 1.8rem;
      color: #d63d68;
      margin-bottom: 30px;
    }

    button {
      padding: 12px 24px;
      font-size: 1.1rem;
      background-color: #000;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background-color: #333;
    }

    #typingText {
      font-size: 1.2rem;
      color: #333;
      white-space: pre-wrap;
      min-height: 80px;
    }

    #pockyImage {
      margin-top: 20px;
      width: 60%;
      max-width: 280px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="slide active" id="slide1">
    <h1>어떤 맛으로 가볼래? ♡</h1>
    <button onclick="rollDice()">주사위 굴리기 ♡</button>
  </div>

  <div class="slide" id="slide2">
    <h1 id="typingText"></h1>
    <button onclick="goToSlide(3)">먹으러 가기 🍫</button>
  </div>

  <div class="slide" id="slide3">
    <h1 id="endingText"></h1>
    <img id="pockyImage" src="pocky-invisible.jpeg" alt="포키 사라짐 이미지" />
  </div>

  <script>
    const slides = document.querySelectorAll(".slide");
    const flavors = ["초콜릿", "말차", "딸기", "쿠키앤크림", "블루베리", "바나나"];

    function goToSlide(n) {
      slides.forEach((slide, index) => {
        slide.classList.remove("active");
        if (index === n - 1) {
          slide.classList.add("active");
        }
      });
      if (n === 3) showEnding();
    }

    function rollDice() {
      const selected = flavors[Math.floor(Math.random() * flavors.length)];
      goToSlide(2);
      typeText(`축하해~ ✨\n너의 포키는 ${selected} 맛이야! 🍓`);
    }

    function typeText(text) {
      const el = document.getElementById("typingText");
      el.innerText = "";
      let i = 0;
      const interval = setInterval(() => {
        el.innerText += text.charAt(i);
        i++;
        if (i >= text.length) clearInterval(interval);
      }, 70);
    }

    function showEnding() {
      const el = document.getElementById("endingText");
      const text = "포키를 들었는데… 어라?\n투명화되어 사라져버렸어…♡\n아쉽지만 다음에 또 만나자!";
      el.innerText = "";
      let i = 0;
      const interval = setInterval(() => {
        el.innerText += text.charAt(i);
        i++;
        if (i >= text.length) {
          clearInterval(interval);
          document.getElementById("pockyImage").style.display = "block";
        }
      }, 70);
    }
  </script>

</body>
</html>
